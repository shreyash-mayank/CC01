version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: community-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: community-platform
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: community-server
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/community-platform
      JWT_SECRET: dev-secret-key-change-in-production
      NODE_ENV: development
      CLIENT_URL: http://localhost:3000
    depends_on:
      - mongo
    volumes:
      - ./server:/app
    command: npm run dev

  client:
    build: ./client
    container_name: community-client
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - server
    volumes:
      - ./client:/app

volumes:
  mongo_data:
